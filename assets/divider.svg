<svg viewBox="0 0 1200 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dblade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.15"/>
      <stop offset="8%" stop-color="#FF1E1E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF4D4D"/>
      <stop offset="92%" stop-color="#FF1E1E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#dglow)">
    <line x1="0" y1="15" x2="1200" y2="15" stroke="url(#dblade)" stroke-width="3.5"/>
  </g>
  <circle cx="600" cy="15" r="7" fill="#0D0D0D" stroke="#FF1E1E" stroke-width="2"/>
  <circle cx="600" cy="15" r="2.5" fill="#FF1E1E"/>
</svg>
